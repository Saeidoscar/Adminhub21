services:
  postgres:
    image: postgres:16-alpine
    container_name: ah21-postgres
    environment:
      POSTGRES_DB: adminhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adminhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ah21-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ah21-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: adminhub
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: log
    volumes:
      - ./apps/api:/var/www/html
    init: true

  nginx:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.nginx
    container_name: ah21-nginx
    depends_on:
      - api
    ports:
      - "8080:80"
    init: true

  horizon:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ah21-horizon
    command: ["php", "/var/www/html/artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: adminhub
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./apps/api:/var/www/html
    init: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ah21-web
    depends_on:
      - nginx
    ports:
      - "8444:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    init: true

volumes:
  pg_data:
  redis_data:
