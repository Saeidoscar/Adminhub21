services:
  postgres:
    image: postgres:16-alpine
    container_name: adminhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adminhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adminhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adminhub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: adminhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.adminhub21.com}
      # Required: the entrypoint refuses to start without it.
      APP_KEY: ${APP_KEY:?set APP_KEY in the deploy environment}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # The API container owns schema changes; Horizon waits for it.
      RUN_MIGRATIONS: "true"
      SEED_DEMO: "false"
      MEDIA_DISK: ${MEDIA_DISK:-s3}
      MEDIA_URL: ${MEDIA_URL:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: adminhub
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@adminhub21.com}
      MAIL_FROM_NAME: "${APP_NAME:-AdminHub21 API}"
    volumes:
      - api_storage:/var/www/html/storage
    init: true

  nginx:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.nginx
    container_name: adminhub-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    init: true

  horizon:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: adminhub-horizon
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in the deploy environment}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      RUN_MIGRATIONS: "false"
      MEDIA_DISK: ${MEDIA_DISK:-s3}
      MEDIA_URL: ${MEDIA_URL:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: adminhub
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    init: true

  workspace:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: adminhub-workspace
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "${WORKSPACE_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://nginx
    init: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: adminhub-web
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "${WEB_PORT:-8443}:80"
    init: true

volumes:
  pg_data:
  redis_data:
  api_storage:
