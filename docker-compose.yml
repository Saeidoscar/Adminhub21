services:
  postgres:
    image: postgres:16-alpine
    container_name: adminhub-postgres
    environment:
      POSTGRES_DB: adminhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adminhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runner
    container_name: adminhub-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/adminhub
      PORT: 8787
      NODE_ENV: development
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me
      CORS_ORIGINS: http://localhost:8443,http://localhost:5173,http://localhost:3000
    ports:
      - "8787:8787"
    init: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: adminhub-web
    depends_on:
      - api
    ports:
      - "8443:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8787
    init: true

volumes:
  pg_data:
