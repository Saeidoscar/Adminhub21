services:
  postgres:
    image: postgres:16-alpine
    container_name: adminhub-postgres
    environment:
      POSTGRES_DB: adminhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adminhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adminhub-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: adminhub-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_VERSION: "1.0.0"
      # Throwaway key for a local stack only. Never reuse it outside a laptop.
      APP_KEY: "base64:BDN30Rf98Z8zu02fgWxd5DjiKaRnwncD+f477BNdaDU="
      RUN_MIGRATIONS: "true"
      SEED_DEMO: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: adminhub
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: ""
      MEDIA_DISK: public
    volumes:
      - ./apps/api:/var/www/html
      - /var/www/html/vendor
      - api_storage:/var/www/html/storage
    init: true

  nginx:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.nginx
    container_name: adminhub-nginx
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      # Nginx serves /storage directly, so it needs the same files the API
      # writes; in production that path is a CDN origin instead.
      - ./apps/api:/var/www/html:ro
      - api_storage:/var/www/html/storage:ro
    init: true

  horizon:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: adminhub-horizon
    command: ["php", "/var/www/html/artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_VERSION: "1.0.0"
      APP_KEY: "base64:BDN30Rf98Z8zu02fgWxd5DjiKaRnwncD+f477BNdaDU="
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: adminhub
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./apps/api:/var/www/html
      - /var/www/html/vendor
    init: true

  workspace:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: adminhub-workspace
    depends_on:
      - nginx
    ports:
      - "3000:3000"
    environment:
      # Server components and server actions call the API over the compose
      # network; the browser never talks to it directly.
      NEXT_PUBLIC_API_BASE_URL: http://nginx
      # Canonical URLs, sitemap and Open Graph tags are built from this. It must
      # be the address the *browser* uses, not the compose service name.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    init: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: adminhub-web
    depends_on:
      - nginx
    ports:
      - "8443:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    init: true

  mailpit:
    image: axllent/mailpit:latest
    container_name: adminhub-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    init: true

volumes:
  pg_data:
  redis_data:
  api_storage:

