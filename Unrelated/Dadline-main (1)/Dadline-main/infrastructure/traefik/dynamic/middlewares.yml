# infrastructure/traefik/dynamic/middlewares.yml
# میدل‌ورهای عمومی (سند ۱۰، ۱۵)

http:
  middlewares:
    secure-headers:
      headers:
        sslRedirect: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"

    api-ratelimit:
      rateLimit:
        average: 60
        period: 1m
        burst: 30
        sourceCriterion:
          requestHeaderName: X-Forwarded-For

    login-ratelimit:
      rateLimit:
        average: 5
        period: 1m
        burst: 5
        sourceCriterion:
          requestHeaderName: X-Forwarded-For
