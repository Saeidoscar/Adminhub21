# infrastructure/redis/redis.conf
# تنظیمات پایه برای Redis 8 — Cache + Session + Queue (Horizon)

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence — AOF برای امنیت داده‌ی صف (Queue) و Session
appendonly yes
appendfsync everysec

# حافظه — برای dev محدودیت سبک، در production باید مطابق منابع سرور تنظیم شود
maxmemory 300mb
maxmemory-policy noeviction

# لاگ
loglevel notice
