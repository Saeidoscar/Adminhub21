name: dadline

networks:
  proxy:
  backend:
  internal:

volumes:
  postgres_data:
  redis_data:
  traefik_certs:
  portainer_data:
  pgadmin_data:

services:

  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/certs
    networks: [proxy, backend]

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: unless-stopped
    env_file: ./apps/web/.env
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`dadline.net`)"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=secure-headers@file"

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
    restart: unless-stopped
    env_file: ./apps/admin/.env
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.dadline.net`)"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=secure-headers@file"

  office:
    build:
      context: .
      dockerfile: ./apps/office/Dockerfile
    restart: unless-stopped
    env_file: ./apps/office/.env
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.office.rule=Host(`office.dadline.net`)"
      - "traefik.http.routers.office.tls.certresolver=letsencrypt"
      - "traefik.http.routers.office.middlewares=secure-headers@file"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    env_file: ./apps/api/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [proxy, backend, internal]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.dadline.net`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=secure-headers@file,api-ratelimit@file"
      - "traefik.http.routers.api-otp.rule=Host(`api.dadline.net`) && PathPrefix(`/otp`)"
      - "traefik.http.routers.api-otp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-otp.middlewares=secure-headers@file,otp-strict-ratelimit@file"
      - "traefik.http.routers.api-otp.priority=10"

  horizon:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    command: php artisan horizon
    restart: unless-stopped
    env_file: ./apps/api/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, internal]

  scheduler:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    restart: unless-stopped
    env_file: ./apps/api/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, internal]

  postgres:
    build: ./infrastructure/postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dadline
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d dadline"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/etc/redis/redis.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [internal, proxy]
    env_file: .env
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`pgadmin.dadline.net`)"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portainer.middlewares=secure-headers@file"
      - "traefik.http.services.portainer.loadbalancer.server.scheme=https"
      - "traefik.http.services.portainer.loadbalancer.server.port=8080"

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.dadline.net`)"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portainer.middlewares=secure-headers@file"
      # تنظیمات مخصوص پورتینر برای Traefik (چون پورتینر HTTPS است)
      - "traefik.http.services.portainer.loadbalancer.server.scheme=https"
      - "traefik.http.services.portainer.loadbalancer.server.port=9443"
