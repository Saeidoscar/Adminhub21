name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  PHP_VERSION: "8.4"

jobs:
  frontend-format:
    name: Frontend · format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install

      - run: pnpm format --check

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install

      - run: pnpm build

  api-tests:
    name: API · PHP 8.4 · PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adminhub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # GitHub waits for this health check before running the steps below.
        options: >-
          --health-cmd "pg_isready -U postgres -d adminhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # These reach PHPUnit as real environment variables, and a real variable
    # wins over an <env> entry in phpunit.xml (PHPUnit only overrides an
    # existing value when force="true"). That is what switches the suite from
    # its local sqlite default to PostgreSQL, matching production.
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: adminhub_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, bcmath, dom, curl, xml
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=-1

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
          composer-options: --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan package:discover --ansi

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          php artisan test --colors=always 2>&1 | tee /tmp/phpunit.log

      - name: Surface failures
        if: failure()
        shell: bash
        run: |
          tail -c 6000 /tmp/phpunit.log > /tmp/tail.log 2>/dev/null || true
          python3 - <<'PY'
          data = open('/tmp/tail.log', errors='replace').read()
          escaped = data.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=phpunit::' + escaped)
          PY
