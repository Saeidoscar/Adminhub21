name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  PHP_VERSION: "8.4"

jobs:
  frontend-format:
    name: Frontend · format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install

      - run: pnpm format --check

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install

      # The workspace (Vite) and the public surface (Next.js) are separate
      # builds; a 1.0 is only shippable when both compile.
      - name: Build workspace app
        run: pnpm build

      - name: Build public site
        run: pnpm build:web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: https://adminhub21.example

  api-tests:
    name: API · PHP 8.4 · PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adminhub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # GitHub waits for this health check before running the steps below.
        options: >-
          --health-cmd "pg_isready -U postgres -d adminhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # These reach PHPUnit as real environment variables, and a real variable
    # wins over an <env> entry in phpunit.xml (PHPUnit only overrides an
    # existing value when force="true"). That is what switches the suite from
    # its local sqlite default to PostgreSQL, matching production.
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: adminhub_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, bcmath, dom, curl, xml
          coverage: pcov
          tools: composer:v2
          ini-values: memory_limit=-1

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
          composer-options: --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan package:discover --ansi

      - name: Run test suite
        run: php artisan test --colors=always --log-junit /tmp/junit.xml

      # One annotation per failing test, so a red run is diagnosable from the
      # checks API without downloading the (large) job log.
      - name: Report failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob('/tmp/junit.xml') + glob.glob('/tmp/**/junit.xml', recursive=True)
          if not files:
              print('::warning title=phpunit::No JUnit report was produced.')
              raise SystemExit(0)

          for case in ET.parse(files[0]).getroot().iter('testcase'):
              problem = case.find('failure') if case.find('failure') is not None else case.find('error')
              if problem is None:
                  continue
              name = f"{case.get('classname', '')}::{case.get('name', '')}".strip(':')
              text = (problem.get('message') or problem.text or 'failed').strip()
              text = ' '.join(text.split())[:900]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={name}::{text}')
          PY
