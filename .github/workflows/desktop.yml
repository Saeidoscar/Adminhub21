name: Desktop

# Builds the Windows demo (.exe) with the full Next.js app inside.
#
#  1. `desktop/prepare.mjs` builds Next in standalone mode against the bundled
#     demo API, then bundles that API to a single CommonJS file.
#  2. electron-builder produces an NSIS installer and a portable executable.
#
# Trigger it with a tag (`desktop-v1.0.0`) or from the Actions tab.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read
  # Used only to paste the builder log into the open pull request when a build
  # fails: workflow logs are not always reachable from the API.
  pull-requests: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  windows:
    name: Windows · installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # `desktop/` is intentionally outside the pnpm workspace: it needs Electron
      # and electron-builder only when a Windows binary is being produced, and
      # keeping it out means the Docker and CI installs stay lean.
      - name: Install desktop toolchain
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build app and demo API
        run: node desktop/prepare.mjs

      - name: Package
        working-directory: desktop
        shell: pwsh
        env:
          # We do not sign, so skip the certificate discovery (and the symlink
          # extraction that comes with it on Windows runners).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win --publish never 2>&1 |
            Tee-Object -FilePath electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload builder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builder-log
          path: desktop/electron-builder.log
          if-no-files-found: ignore
          retention-days: 7

      # `extraResources` puts app/ and build/ straight under resources/, so the
      # packaged layout is resources/{app,build} and not resources/app/app.
      - name: Smoke test the packaged app
        run: node desktop/smoke.mjs --root desktop/release/win-unpacked/resources

      - name: Report a failed build on the pull request
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $parts = @("Desktop build failed for commit ${{ github.sha }} (run ${{ github.run_id }}).")
          if (Test-Path electron-builder.log) {
            $parts += "electron-builder.log (last 80 lines):"
            $parts += '```'
            $parts += (Get-Content electron-builder.log -Tail 80)
            $parts += '```'
          }
          $parts += "release/ contents:"
          $parts += '```'
          if (Test-Path release) { $parts += (Get-ChildItem release | Select-Object -ExpandProperty Name) } else { $parts += "no release directory" }
          $parts += '```'
          Set-Content -Path ..\desktop-failure.md -Value $parts -Encoding utf8
          gh pr comment 2 --body-file ..\desktop-failure.md

      - name: List installers
        shell: pwsh
        run: Get-ChildItem desktop/release -Filter *.exe | Select-Object Name, Length

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: adminhub21-desktop-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
