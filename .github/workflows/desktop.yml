name: Desktop demo

# Builds the Windows demo installers. Kept separate from `ci.yml` because the
# Electron toolchain is ~300 MB and only matters when a release is cut.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows · installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Typecheck desktop server
        run: pnpm typecheck:desktop

      - name: Build renderer
        run: pnpm build

      - name: Bundle local server
        working-directory: apps/desktop
        run: node scripts/bundle-server.mjs

      - name: Sync renderer
        working-directory: apps/desktop
        run: node scripts/sync-renderer.mjs

      - name: Package installer + portable exe
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
        env:
          # Optional. Without these the build succeeds and the binaries are
          # unsigned (SmartScreen warns once). Add both repository secrets to
          # sign: CSC_LINK is the .pfx as base64 or a URL, CSC_KEY_PASSWORD is
          # its password. See docs/desktop/README.md#7-signing.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Published next to the binaries so a download can be verified even
      # though the builds are unsigned.
      - name: Checksums
        working-directory: apps/desktop/release
        run: |
          : > SHA256SUMS.txt
          for artifact in *.exe; do
            [ -e "$artifact" ] || continue
            sha256sum "$artifact" >> SHA256SUMS.txt
            echo "::notice file=$artifact::$(sha256sum "$artifact")"
          done
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Signature report
        working-directory: apps/desktop/release
        shell: pwsh
        run: |
          Get-ChildItem *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            $signer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "(none)" }
            Write-Host ("{0}: {1} — {2}" -f $_.Name, $sig.Status, $signer)
            if ($sig.Status -ne "Valid") {
              Write-Host "::warning file=$($_.Name)::Unsigned build ($($sig.Status)). Users will see a SmartScreen prompt."
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adminhub21-desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # A tag push is a release. Publishing here means the download link is the
      # release page, not an expiring artifact zip — the binaries, their blockmaps
      # and SHA256SUMS.txt all land next to each other in one place.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: apps/desktop/release
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Windows demo build of AdminHub21. Opens straight into the assistant.

          **Unsigned.** Windows SmartScreen will warn on first launch — see
          [docs/desktop/README.md §7](https://github.com/Saeidoscar/Adminhub21/blob/main/docs/desktop/README.md#7-signing)
          for why, how to verify the download, and how to sign it.

          Verify before running:

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```

          `-setup.exe` installs under your user profile; `-portable.exe` runs without installing.
          Both carry the same 12-tool MCP registry and talk only to `127.0.0.1`.
          EOF

          # Only hand gh the files that actually exist, so a build without
          # blockmaps still publishes.
          files=()
          for f in ./*-setup.exe ./*-portable.exe ./*.blockmap ./SHA256SUMS.txt; do
            [ -e "$f" ] && files+=("$f")
          done

          printf 'publishing %s with:\n' "$TAG"
          printf '  %s\n' "${files[@]}"

          gh release create "$TAG" \
            --title "AdminHub21 Desktop 1.0.0 · assistant home screen" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${files[@]}"
